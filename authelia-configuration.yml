server:
  address: 'tcp://0.0.0.0:9091'

log:
  level: 'info'

identity_validation:
  reset_password:
    jwt_secret: 'a_very_important_jwt_secret_32_characters_long'

authentication_backend:
  file:
    path: '/run/secrets/authelia_users'
    password:
      algorithm: 'argon2'

access_control:
  default_policy: 'one_factor'

session:
  secret: 'a_very_important_session_secret_32_characters'
  cookies:
    - name: 'authelia_session'
      domain: 'swarm.localhost'
      authelia_url: 'https://authelia.swarm.localhost'

storage:
  encryption_key: 'a_very_important_storage_encryption_key_32_chars'
  local:
    path: '/data/db.sqlite3'

notifier:
  filesystem:
    filename: '/data/notification.txt'

