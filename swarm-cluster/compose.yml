services:
  manager:
    image: docker:dind
    privileged: true
    hostname: manager
    environment:
      DOCKER_TLS_CERTDIR: ""
    ports:
      - "80:80"
      - "8080:8080"
      - "9000:9000"
      - "3000:3000"
      - "5173:5173"

  node:
    image: docker:dind
    privileged: true
    scale: 3
    environment:
      DOCKER_TLS_CERTDIR: ""
