version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - mfp-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  server:
    image: ghcr.io/papouloutoute/esgi-tp-swarn-server:main
    environment:
      DB_HOST: db
    networks:
      - mfp-net
      - web
    deploy:
      replicas: 2
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.mfp-api.rule=Host(`api.swarm.localhost`)"
        - "traefik.http.routers.mfp-api.entrypoints=web"
        - "traefik.http.services.mfp-api.loadbalancer.server.port=3000"

  client:
    image: ghcr.io/papouloutoute/esgi-tp-swarn-client:main
    environment:
      VITE_API_TARGET: http://server:3000
    networks:
      - mfp-net
      - web
    deploy:
      replicas: 2
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.mfp-app.rule=Host(`app.swarm.localhost`) || Host(`mfp.swarm.localhost`)"
        - "traefik.http.routers.mfp-app.entrypoints=web"
        - "traefik.http.services.mfp-app.loadbalancer.server.port=5173"

volumes:
  db-data:

networks:
  mfp-net:
    driver: overlay
  web:
    external: true
